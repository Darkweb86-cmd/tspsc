<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --canvas: #020617;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-cyan: #22d3ee;
            --accent-indigo: #6366f1;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        body {
            margin: 0;
            padding: 80px 40px;
            background: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0, transparent 40%),
                radial-gradient(at 100% 100%, rgba(34, 211, 238, 0.1) 0, transparent 40%),
                var(--canvas);
            background-attachment: fixed;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-primary);
        }

        /* 4-Column Responsive Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 32px;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Paper Card - The Glass Container */
        .paper-card {
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .paper-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .paper-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 24px;
            background: linear-gradient(to right, #fff, var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Concept Entry Row */
        .concept-entry {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
        }

        .concept-entry:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .concept-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        /* Premium Counter Controls */
        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px;
            border-radius: 14px;
        }

        .btn {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .btn:hover {
            background: var(--accent-indigo);
            box-shadow: 0 0 15px var(--accent-indigo);
        }

        .attempt-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.2rem;
            color: var(--accent-cyan);
            min-width: 30px;
            text-align: center;
        }

        /* Sync Pulse Effect */
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        .syncing { animation: pulse 1s infinite; }

        @media (max-width: 1300px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="grid">
    {% for paper in papers %}
    <div class="paper-card">
        <div class="paper-title">{{ paper.name }}</div>
        
        <div class="concepts-container">
            {% for concept in paper.concepts.all %}
            <div class="concept-entry" id="node-{{ concept.id }}">
                <span class="concept-name">{{ concept.name }}</span>
                
                <div class="controls">
                    <button class="btn" onclick="modify('{{ concept.id }}', -1)">−</button>
                    <span class="attempt-val" id="val-{{ concept.id }}">{{ concept.attempts }}</span>
                    <button class="btn" onclick="modify('{{ concept.id }}', 1)">+</button>
                </div>
            </div>
            {% empty %}
            <div style="color: var(--text-secondary); font-size: 0.8rem;">No modules discovered.</div>
            {% endfor %}
        </div>
    </div>
    {% endfor %}
</div>

<script>
    /**
     * Logic: Updates UI instantly (Optimistic), then saves to DB.
     */
    async function modify(id, delta) {
        const display = document.getElementById(`val-${id}`);
        const row = document.getElementById(`node-${id}`);
        
        let current = parseInt(display.innerText);
        let newVal = current + delta;
        if (newVal < 0) return;

        // 1. Instant Visual Feedback
        display.innerText = newVal;
        row.classList.add('syncing');

        // 2. Persist to Django
        try {
            const response = await fetch('/update-attempts/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({
                    id: id,
                    attempts: newVal
                })
            });

            if (!response.ok) throw new Error("Server Error");

            // Success: Remove sync pulse
            setTimeout(() => row.classList.remove('syncing'), 400);

        } catch (error) {
            // Revert on failure
            display.innerText = current;
            row.classList.remove('syncing');
            alert("Connection synchronization failed.");
        }
    }
</script>

</body>
</html>
